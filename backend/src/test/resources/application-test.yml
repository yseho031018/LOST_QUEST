# Test-only H2. This file and dependency are not included in the runnable JAR.
spring:
  config:
    import: ""
  datasource:
    # One in-memory database per Spring test context. A shared name let every newly started context
    # (create-drop) rebuild the tables under cached ones, restarting ids that their singletons still remembered.
    # Keep an explicit url: without one the MySQL url from application.yml would apply.
    url: jdbc:h2:mem:lostquest-${random.uuid};DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  police-api:
    # Tests never reach the real 경찰청 API: police tests start their own local mock server.
    base-url: http://127.0.0.1:9/police-api-disabled-in-tests
    connect-timeout: 1s
    read-timeout: 2s
    lost:
      service-key: ""
    found:
      service-key: ""
    code:
      service-key: ""
  image-storage:
    # A fresh temporary directory per test JVM; never the developer's .local/uploads.
    local-dir: ${java.io.tmpdir}/lost-quest-test-images/${random.uuid}
  jwt:
    # Test-only signing key; never reuse outside automated tests.
    secret: test-only-jwt-secret-not-for-real-use-0123456789
    access-token-expiration: 1h
